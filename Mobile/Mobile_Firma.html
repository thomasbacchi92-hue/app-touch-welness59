<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Firma Elettronica - TOUCH WELNESS</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff !important; color: #000000 !important; overflow: hidden; position: fixed; font-family: -apple-system, sans-serif; }
        .app-container { display: flex; flex-direction: column; height: 100%; width: 100%; background: #ffffff; }
        .header { flex-shrink: 0; text-align: center; padding: 15px; border-bottom: 1px solid #e2e8f0; }
        .document-area { flex: 1; overflow-y: auto; padding: 20px; font-size: 13px; line-height: 1.5; border-bottom: 2px solid #e2e8f0; background: #fff; }
        .signature-section { flex-shrink: 0; height: 200px; background: #f8fafc; padding: 10px; display: flex; flex-direction: column; }
        .signature-box { position: relative; flex: 1; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; touch-action: none; overflow: hidden; }
        #sigCanvas { width: 100%; height: 100%; display: block; }
        .sig-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.9); z-index: 5; pointer-events: none; }
        .actions { flex-shrink: 0; display: flex; gap: 10px; padding: 15px; padding-bottom: max(15px, env(safe-area-inset-bottom)); background: #ffffff; border-top: 1px solid #e2e8f0; }
        .btn { flex: 1; padding: 15px; border-radius: 8px; border: none; font-weight: 900; font-size: 13px; text-transform: uppercase; cursor: pointer;}
        .btn-cancel { background: #e2e8f0; color: #000; }
        .btn-save { background: #15803d; color: #fff; }
        .touch-cb { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid #000; font-weight: bold; margin-right: 5px; background: #fff; }
        
        /* Modale Elegante */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-box { background: #ffffff; padding: 30px 20px; border-radius: 16px; text-align: center; width: 85%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="resultModal" class="modal-overlay">
    <div class="modal-box">
        <i id="modalIcon" class="material-icons-round" style="font-size: 50px; margin-bottom: 10px; color: #15803d;">check_circle</i>
        <h3 id="modalTitle" style="margin: 0 0 10px 0; color: #000000;">Salvato!</h3>
        <p id="modalMsg" style="font-size: 14px; color: #64748b; margin-bottom: 25px;">Documento archiviato con successo.</p>
        <button class="btn btn-save" style="width: 100%;" onclick="closeApp()">CHIUDI SCHEDA</button>
    </div>
</div>

<div class="app-container">
    <div class="header">
        <div style="font-weight: 900; color: #b45309; font-size: 14px;">MODULO PRIVACY E CONSENSI</div>
        <div id="opInfo" style="font-size: 10px; color: #64748b; margin-top: 3px;">Caricamento...</div>
    </div>

    <div class="document-area" id="docContent">Preparazione documento...</div>

    <div class="signature-section">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span style="font-size:11px; font-weight:bold; color:#2563eb;">FIRMA OBBLIGATORIA:</span>
            <button onclick="clearCanvas()" style="font-size:10px; background:none; border:1px solid #94a3b8; border-radius:4px; padding:2px 8px;">PULISCI</button>
        </div>
        <div class="signature-box" id="canvasParent">
            <div class="sig-overlay" id="sigOverlay">
                <span style="font-size: 12px; color: #94a3b8;">FIRMA QUI CON IL DITO</span>
            </div>
            <canvas id="sigCanvas"></canvas>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-cancel" onclick="closeApp()">ANNULLA</button>
        <button class="btn btn-save" id="btnFinalSave" onclick="processSave()">ACCETTA</button>
    </div>
</div>

<script>
    const sId = localStorage.getItem("tw_structure_id");
    const uNick = localStorage.getItem("tw_user") || "N.D.";
    const urlParams = new URLSearchParams(window.location.search);
    const clientName = urlParams.get('cliente') || 'Ospite';
    const appId = urlParams.get('appId');
    const appDate = urlParams.get('date');
    
    const fbConfig = {
        apiKey: "AIzaSyCrDuK7SWHdbzrJR-pNpxmRwGnZgV2Dd2Y",
        authDomain: "touch-welness-massage.firebaseapp.com",
        databaseURL: "https://touch-welness-massage-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "touch-welness-massage",
        storageBucket: "touch-welness-massage.firebasestorage.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(fbConfig);

    let canvas = document.getElementById('sigCanvas');
    let ctx = canvas.getContext('2d');
    let drawing = false;
    let hasSigned = false;

    function initCanvas() {
        const parent = document.getElementById('canvasParent');
        canvas.width = parent.clientWidth;
        canvas.height = parent.clientHeight;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';
    }

    function getTouchPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); drawing = true; hasSigned = true;
        document.getElementById('sigOverlay').style.display = 'none';
        const pos = getTouchPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault(); if(!drawing) return;
        const pos = getTouchPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke();
    }, {passive: false});

    canvas.addEventListener('touchend', () => { drawing = false; });

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); hasSigned = false;
        document.getElementById('sigOverlay').style.display = 'flex';
    }

    async function loadDocument() {
        document.getElementById('opInfo').innerText = `Struttura: ${sId} | Op: ${uNick}`;
        try {
            const snap = await firebase.database().ref(`MASTER_ADMIN_DB/structures_data/${sId}`).once('value');
            const data = snap.val() || {};
            const activeDocs = data.settings?.active_docs || [];
            const contracts = data.contracts || {};
            let html = "";
            activeDocs.forEach(name => {
                for(let k in contracts) { if((contracts[k].documentName || k) === name) html += contracts[k].testoGenerato; }
            });
            html = html.replace(/\{\{NOME_CLIENTE\}\}/gi, `<b style="text-transform:uppercase;">${clientName}</b>`).replace(/☐/g, '<span class="touch-cb" onclick="this.innerText=(this.innerText==\'☐\'?\'☑\':\'☐\')">☐</span>');
            document.getElementById('docContent').innerHTML = html;
            setTimeout(initCanvas, 500);
        } catch(e) { console.error(e); }
    }

    async function processSave() {
        if(!hasSigned) {
            return showResult(false, "Devi firmare nel riquadro per poter accettare.");
        }

        const btn = document.getElementById('btnFinalSave');
        btn.disabled = true; btn.innerText = "ATTENDI...";

        // =========================================================================
        // LINK CORRETTO (SENZA APOSTROFO ALLA FINE)
        // =========================================================================
        const SERVER_URL = "https://script.google.com/macros/s/AKfycbx1EPW47IfK5F2LBZpkxep-7tKiqC-eaZfSVUD9NCM5mT_FscPmPLiYHd45XnniPQZWiA/exec";

        try {
            // 1. Prepara i Dati
            const base64 = canvas.toDataURL('image/png');
            const htmlContent = document.getElementById('docContent').innerHTML;
            
            const payload = {
                appId: appId || "ND",
                image: base64,
                now: new Date().toLocaleString('it-IT'),
                docs: [{ title: "Modulo Privacy Mobile", content: htmlContent }]
            };

            // 2. Chiamata al server sicura per Mobile (Senza redirect forzato)
            const res = await fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            if(!res.ok) throw new Error("Errore Server Google: Status " + res.status);

            // 3. Lettura Risposta (Tollerante)
            const textResponse = await res.text();
            let data = {};
            try { 
                data = JSON.parse(textResponse); 
            } catch(e) { 
                data = { url: textResponse.trim() }; 
            }

            const pdfLink = data.url || data.fileUrl || data.link || "";

            if(!pdfLink || !pdfLink.startsWith("http")) {
                throw new Error("Il server non ha restituito un Link PDF valido.");
            }

            // 4. Salvataggio in Appuntamento (per accendere Spia Verde)
            if (appId && appDate && sId) {
                const snapApp = await firebase.database().ref(`MASTER_ADMIN_DB/structures_data/${sId}/app/${appDate}`).once('value');
                let apps = snapApp.val() || [];
                if (!Array.isArray(apps)) apps = Object.values(apps);
                const idx = apps.findIndex(x => String(x.id) === String(appId));
                if(idx > -1) {
                    apps[idx].privacyLink = pdfLink;
                    apps[idx].privacy = true;
                    await firebase.database().ref(`MASTER_ADMIN_DB/structures_data/${sId}/app/${appDate}`).set(apps);
                }
            }

            // 5. Salvataggio nel CRM Globale
            const snapCrm = await firebase.database().ref('MASTER_ADMIN_DB/global_customers').once('value');
            const list = snapCrm.val() || {};
            let cId = Object.keys(list).find(k => list[k].nome?.toLowerCase() === clientName.toLowerCase());
            if(!cId) cId = "CUST_" + Date.now();

            await firebase.database().ref(`MASTER_ADMIN_DB/global_customers/${cId}/docs`).push({
                dataInserimento: new Date().toLocaleString('it-IT'),
                nomeDoc: "Consenso Privacy Mobile",
                link: pdfLink,
                struttura: sId || "N.D.",
                operatore: uNick
            });

            await firebase.database().ref(`MASTER_ADMIN_DB/global_customers/${cId}`).update({ 
                nome: clientName !== 'Ospite' ? clientName : "Cliente Anonimo",
                privacy: true, 
                lastPrivacyDate: new Date().toLocaleDateString('it-IT') 
            });

            showResult(true, "Documento PDF creato e archiviato nel gestionale!");

        } catch(e) { 
            console.error(e);
            let errorMessage = e.message;
            if(errorMessage === "Failed to fetch") {
                errorMessage = "Connessione di rete rifiutata. L'URL di Google Script potrebbe non essere corretto o il browser blocca la richiesta.";
            }
            showResult(false, errorMessage);
            btn.disabled = false; btn.innerText = "RIPROVA";
        }
    }

    function showResult(success, message) {
        const modal = document.getElementById('resultModal');
        const icon = document.getElementById('modalIcon');
        const title = document.getElementById('modalTitle');
        const msg = document.getElementById('modalMsg');

        if(success) {
            icon.innerText = "check_circle"; icon.style.color = "#15803d";
            title.innerText = "Salvato!";
        } else {
            icon.innerText = "error"; icon.style.color = "#b91c1c";
            title.innerText = "Errore di Generazione";
        }
        msg.innerText = message;
        modal.style.display = "flex";
    }

    // CHIUSURA SCHEDA
    function closeApp() {
        window.close();
        setTimeout(() => window.history.back(), 300);
    }

    window.onload = loadDocument;
    window.onresize = initCanvas;
</script>
</body>
</html>
