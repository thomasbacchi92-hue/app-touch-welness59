<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Template WhatsApp - TOUCH WELNESS</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  :root { --bg-body: #0f172a; --bg-panel: #1e293b; --border-line: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --gold: #fbbf24; --green: #10b981; --red: #ef4444; }
  :root.light-theme { --bg-body: #f8fafc; --bg-panel: #ffffff; --border-line: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; }
  body { font-family: -apple-system, sans-serif; background: var(--bg-body); margin: 0; color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  * { box-sizing: border-box; }
  .navbar { background: var(--bg-panel); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; flex-shrink: 0; }
  .navbar h1 { margin: 0; font-size: 18px; color: var(--accent); display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px;}
  .btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.2s; font-size: 13px; }
  .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
  .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-line); }
  .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; }
  .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--bg-panel); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border-line); }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
  .form-input { width: 100%; padding: 12px; border: 1px solid var(--border-line); border-radius: 8px; font-size: 14px; background: var(--bg-body); color: var(--text-main); outline: none; transition: 0.2s; color-scheme: dark;}
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
  #toastBlue { visibility: hidden; min-width: 250px; background: var(--green); color: white; text-align: center; border-radius: 8px; padding: 16px; position: fixed; right: 30px; bottom: 30px; z-index: 9999; font-size: 14px; font-weight: bold; opacity: 0; transition: 0.5s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
  #toastBlue.show { visibility: visible; opacity: 1; bottom: 40px; }
</style>
<script>if(localStorage.getItem('tw_admin_theme') === 'light' || localStorage.getItem('tw_theme') === 'light') document.documentElement.classList.add('light-theme');</script>
</head>
<body>

<div id="toastBlue">Notifica</div>

<div class="navbar">
    <h1><i class="material-icons-round">chat</i> Modelli WhatsApp</h1>
    <button class="btn-action btn-outline" onclick="if(window.parent && window.parent.app) { window.parent.app.switchView('stats'); } else { window.history.back(); }">
        <i class="material-icons-round">arrow_back</i> TORNA ALLA DASHBOARD
    </button>
</div>

<div class="main-content">
    <div class="container">
        <div class="card" style="background:rgba(56, 189, 248, 0.05); border-color:rgba(56, 189, 248, 0.2)">
            <h2 style="margin-top:0; color:var(--accent); font-size:18px;">Gestione Template Messaggi</h2>
            <p style="font-size:13px; color:var(--text-muted); line-height:1.5;">Questi messaggi verranno usati automaticamente dal sistema per inviare i promemoria WhatsApp ai clienti. Usa i tag speciali (es: <b>[CLIENTE]</b>, <b>[DATA]</b>, <b>[ORA]</b>, <b>[TRATTAMENTO]</b>) per rendere il messaggio dinamico.</p>
        </div>

        <div class="card">
            <div class="form-group">
                <label style="color:var(--green)">1. Messaggio di Conferma Prenotazione</label>
                <textarea id="tpl_conferma" class="form-input" rows="5" placeholder="Ciao [CLIENTE], confermiamo il tuo appuntamento per il [DATA] alle [ORA]..."></textarea>
            </div>
            
            <div class="form-group">
                <label style="color:var(--gold)">2. Messaggio Promemoria (Giorno Prima)</label>
                <textarea id="tpl_promemoria" class="form-input" rows="5" placeholder="Ti ricordiamo il tuo appuntamento di domani..."></textarea>
            </div>

            <button class="btn-action w-100" style="padding:15px; font-size:16px;" onclick="waApp.saveTemplates()">
                <i class="material-icons-round">save</i> SALVA MODELLI WHATSAPP
            </button>
        </div>
    </div>
</div>

<script>
    const fbConfig = { apiKey: "AIzaSyCrDuK7SWHdbzrJR-pNpxmRwGnZgV2Dd2Y", authDomain: "touch-welness-massage.firebaseapp.com", databaseURL: "https://touch-welness-massage-default-rtdb.europe-west1.firebasedatabase.app", projectId: "touch-welness-massage", storageBucket: "touch-welness-massage.firebasestorage.app" };
    if (!firebase.apps.length) firebase.initializeApp(fbConfig);

    window.waApp = {
        db: firebase.database().ref('MASTER_ADMIN_DB/settings/whatsapp_templates'),
        
        init: function() {
            this.db.once('value').then(snap => {
                const tpl = snap.val() || {};
                document.getElementById('tpl_conferma').value = tpl.conferma || "Ciao [CLIENTE],\nConfermiamo il tuo appuntamento per il trattamento [TRATTAMENTO] in data [DATA] alle ore [ORA].\nTi aspettiamo!";
                document.getElementById('tpl_promemoria').value = tpl.promemoria || "Ciao [CLIENTE],\nTi ricordiamo il tuo appuntamento di domani ([DATA]) alle ore [ORA] per il tuo [TRATTAMENTO].\nA presto!";
            });
        },
        
        showToast: function(m) { const t=document.getElementById("toastBlue"); t.innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); },
        
        saveTemplates: function() {
            const conf = document.getElementById('tpl_conferma').value;
            const prom = document.getElementById('tpl_promemoria').value;
            
            this.db.set({ conferma: conf, promemoria: prom }).then(() => {
                this.showToast("Modelli WhatsApp salvati con successo!");
            });
        }
    };
    
    window.onload = () => window.waApp.init();
</script>
</body>
</html>
