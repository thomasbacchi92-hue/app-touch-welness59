<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Piscina Mobile - TOUCH WELNESS</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
  /* ==========================================
     STILE E DESIGN SYSTEM (Piscina_Mobile_Style)
     ========================================== */
  :root { 
      --bg-body: #0f172a; --bg-panel: #1e293b; --line: #334155; 
      --text-main: #f8fafc; --text-muted: #94a3b8; 
      --accent: #38bdf8; --gold: #fbbf24; --green: #10b981; --red: #ef4444; --purple: #a855f7;
      --toast-blue: #2563eb;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, system-ui, Roboto, sans-serif; background: var(--bg-body); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; color: var(--text-main); padding-bottom: 30px; }
  
  /* HEADER */
  .navbar { background: var(--bg-body); padding: 15px; display: flex; flex-direction: column; gap: 12px; align-items: center; z-index: 20; border-bottom: 1px solid var(--line); box-shadow: 0 4px 15px rgba(0,0,0,0.4); width: 100%; flex-shrink: 0; }
  .navbar-title { font-weight: 900; color: var(--gold); letter-spacing: 1px; font-size: 16px; text-transform: uppercase; text-align: center; width: 100%; margin-bottom: 5px; }
  
  /* BLOCCO DATA CENTRATO */
  .date-ctrl { display: flex; width: 100%; max-width: 400px; align-items: center; justify-content: center; background: var(--bg-panel); padding: 8px; border-radius: 12px; border: 1px solid var(--line); gap: 10px; }
  .btn-arrow { background: var(--accent); color: #0f172a; border: none; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .date-ctrl input[type="date"] { background: transparent; color: var(--text-main); border: none; font-weight: 900; font-size: 16px; text-align: center; outline: none; -webkit-appearance: none; min-height: 40px; width: 140px; color-scheme: dark; padding: 0; margin: 0; }

  /* LAYOUT GENERALE */
  .layout { display: flex; flex-direction: column; gap: 20px; padding: 15px; width: 100%; }

  /* PANNELLI */
  .box { background: var(--bg-panel); padding: 20px; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 5px 20px rgba(0,0,0,0.3); width: 100%; }
  .box h3 { margin: 0 0 15px 0; font-size: 14px; color: var(--gold); border-bottom: 2px solid var(--line); padding-bottom: 10px; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
  
  input, select, textarea { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; margin-bottom: 12px; outline: none; transition: 0.2s; background: var(--bg-body); color: var(--text-main); -webkit-appearance: none; color-scheme: dark; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
  label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 6px; }
  input[type="time"] { font-size: 16px; font-weight: bold; color: var(--accent); text-align: center; }

  .btn-search { background: var(--accent); color: #0f172a; border: none; border-radius: 10px; padding: 0 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-add { width: 100%; padding: 16px; background: var(--accent); color: #0f172a; border: none; font-weight: 900; font-size: 14px; border-radius: 12px; cursor: pointer; margin-top: 10px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;}
  .btn-add.editing { background: var(--gold); }

  .summary-panel, .list-panel { background: var(--bg-panel); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 5px 20px rgba(0,0,0,0.3); width: 100%; }
  .summary-header { background: var(--bg-body); color: var(--text-main); padding: 15px; font-weight: 900; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); text-transform: uppercase; }
  
  .sum-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
  .sum-table th { background: rgba(0,0,0,0.2); padding: 12px 5px; color: var(--text-muted); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .sum-table td { padding: 12px 5px; border-bottom: 1px solid var(--line); font-weight: bold; border-right: 1px solid var(--line); }

  /* Tabella Mobile List */
  .list-head { background: rgba(0,0,0,0.2); color: var(--text-main); padding: 12px 5px; display: grid; grid-template-columns: 40px 35px 1fr 30px 50px 70px 35px 35px; font-size: 9px; font-weight: bold; text-transform: uppercase; align-items: center; border-bottom: 2px solid var(--line); gap: 2px; }
  .row { padding: 12px 5px; display: grid; grid-template-columns: 40px 35px 1fr 30px 50px 70px 35px 35px; border-bottom: 1px solid var(--line); align-items: center; font-size: 11px; gap: 2px; transition: 0.1s; }
  .row:active { background: rgba(56, 189, 248, 0.05); }
  
  .badge { padding: 4px; border-radius: 6px; font-size: 9px; font-weight: bold; text-align: center; display: block; }
  .bg-pool { background: rgba(2, 132, 199, 0.2); color: var(--accent); border: 1px solid var(--accent); }
  .bg-spa { background: rgba(219, 39, 119, 0.2); color: #f472b6; border: 1px solid #f472b6; }
  .bg-out { background: rgba(22, 163, 74, 0.2); color: var(--green); border: 1px solid var(--green); }

  .btn-check { border: 1px solid var(--line); background: var(--bg-body); color: var(--text-muted); padding: 8px 2px; border-radius: 8px; cursor: pointer; font-size: 9px; font-weight: bold; display: flex; align-items: center; gap: 2px; width: 100%; justify-content: center; transition: 0.2s; }
  .btn-check.checked { background: rgba(16, 185, 129, 0.1); color: var(--green); border-color: var(--green); }
  
  .btn-icon { border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; color: var(--text-muted); }
  .btn-icon:active { color: var(--text-main); }
  
  /* MODALI */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  .modal-box { background: var(--bg-panel); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; border: 1px solid var(--line); }
  .modal-btn { width: 100%; padding: 16px; margin-top: 10px; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 14px; }

  #toastBlue { visibility: hidden; width: 90%; background-color: var(--accent); color: #0f172a; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 9999; left: 50%; transform: translateX(-50%); bottom: 30px; font-size: 14px; font-weight: bold; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0; transition: opacity 0.5s, bottom 0.5s; }
  #toastBlue.show { visibility: visible; opacity: 1; bottom: 40px; }
  
  :root.light-theme {
      --bg-body: #f8fafc; --bg-panel: #ffffff; --line: #e2e8f0;
      --text-main: #0f172a; --text-muted: #64748b;
  }
</style>
</head>
<body>

<div id="toastBlue"><i class="material-icons-round">info</i> <span id="toastMsg">Notifica</span></div>

<div class="navbar">
  <div class="navbar-title">AGENDA PISCINA E SPA</div>
  
  <div class="date-ctrl">
      <button class="btn-arrow" onclick="changePoolDate(-1)"><i class="material-icons-round">chevron_left</i></button>
      <input type="date" id="poolDate">
      <button class="btn-arrow" onclick="changePoolDate(1)"><i class="material-icons-round">chevron_right</i></button>
  </div>
</div>

<div class="layout">
    
    <div class="box" style="border-left: 4px solid var(--gold)">
        <h3><i class="material-icons-round">search</i> CERCA CAMERA</h3>
        <div style="display:flex; gap:10px">
            <input type="number" id="searchCam" placeholder="N. Camera" style="margin:0" onkeydown="if(event.key==='Enter') searchRoom()">
            <button class="btn-search" onclick="searchRoom()"><i class="material-icons-round">search</i></button>
        </div>
    </div>

    <div class="box">
        <h3 id="formTitle"><i class="material-icons-round">add_circle</i> NUOVO INGRESSO (2H)</h3>
        <input type="hidden" id="pId">
        <label>Orario Inizio</label><input type="time" id="pOra">
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:10px">
            <div><label>Camera</label><input type="number" id="pCam" onkeydown="if(event.key==='Enter') addEntry()"></div>
            <div><label>Pax</label><input type="number" id="pPers" value="2" onkeydown="if(event.key==='Enter') addEntry()"></div>
        </div>
        <label>Cognome Ospite</label><input type="text" id="pCog" onkeydown="if(event.key==='Enter') addEntry()">
        <label>Area Selezionata</label>
        <select id="pArea">
            <option value="Piscina">Piscina</option>
            <option value="SPA">SPA (Percorso)</option>
            <option value="Esterni">Esterni</option>
        </select>
        <label>Note aggiuntive</label><input type="text" id="pNote" onkeydown="if(event.key==='Enter') addEntry()">

        <button class="btn-add" id="btnSave" onclick="addEntry()"><i class="material-icons-round">save</i> SALVA INGRESSO</button>
        <button onclick="resetForm()" id="btnCancel" style="display:none; width:100%; padding:15px; margin-top:10px; border:1px solid var(--line); background:var(--bg-body); color:var(--text-main); border-radius:10px; font-weight:bold; cursor:pointer; font-size:14px;">ANNULLA MODIFICA</button>
    </div>

    <div class="summary-panel">
        <div class="summary-header">
            <span>OCCUPAZIONE REALE (2H)</span>
            <i class="material-icons-round">timelapse</i>
        </div>
        <table class="sum-table">
            <thead>
                <tr><th>ORA</th><th style="color:var(--accent)">PISC</th><th style="color:#f472b6">SPA</th><th>TOT</th><th style="color:var(--green)">IN</th></tr>
            </thead>
            <tbody id="slotTable"></tbody>
        </table>
    </div>

    <div class="list-panel">
        <div class="list-head">
            <div>Ora</div><div>Cam</div><div>Ospite</div><div>Px</div><div>Area</div><div>In</div><div>Mod</div><div>Del</div>
        </div>
        <div id="poolGrid"></div>
    </div>
    
    <button onclick="exportSimpleExcel()" style="width:100%; padding:16px; background:rgba(16, 185, 129, 0.1); color:var(--green); border:1px solid rgba(16, 185, 129, 0.3); border-radius:12px; font-weight:900; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
        <i class="material-icons-round">download</i> EXPORT EXCEL
    </button>

</div>

<div id="actionModal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modalTitle" style="color:var(--gold); margin-top:0;">Risultato Ricerca</h3>
        <p id="modalMsg" style="font-size:14px; color:var(--text-muted); margin-bottom:20px"></p>
        <div id="modalBtns" style="display:flex; flex-direction:column; gap:8px"></div>
        <button class="modal-btn" style="background:transparent; border:1px solid var(--line); color:var(--text-main); margin-top:15px" onclick="closeModal()">CHIUDI</button>
    </div>
</div>

<script>
/* ==========================================
   MOTORI JS UNIFICATI (DB + Logic + Backup + Init)
   ========================================== */

/* --- 1. Database Manager --- */
const fbConfigPool = {
    apiKey: "AIzaSyCrDuK7SWHdbzrJR-pNpxmRwGnZgV2Dd2Y",
    authDomain: "touch-welness-massage.firebaseapp.com",
    databaseURL: "https://touch-welness-massage-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "touch-welness-massage",
    storageBucket: "touch-welness-massage.firebasestorage.app"
};

if (!firebase.apps.length) firebase.initializeApp(fbConfigPool);

const currentStructureId = localStorage.getItem("tw_structure_id");

if (!currentStructureId) {
    alert("Sessione scaduta. Effettua il Login.");
    window.location.href = "../login.html";
    throw new Error("Accesso Negato: ID Struttura mancante"); 
}

const poolRef = firebase.database().ref('MASTER_ADMIN_DB/structures_data/' + currentStructureId + '/piscina_db_v1');
const settingsRef = firebase.database().ref('MASTER_ADMIN_DB/structures_data/' + currentStructureId + '/settings/orari_moduli');

let poolData = {};
let dbOrari = { piscina: {}, spa: {} };

function initDB() {
    poolRef.on('value', snapshot => {
        poolData = snapshot.val() || {};
        if(typeof loadPoolData === "function") loadPoolData();
    });

    settingsRef.on('value', snap => {
        const val = snap.val() || {};
        dbOrari.piscina = val.piscina || buildDefaultOrari();
        dbOrari.spa = val.spa || buildDefaultOrari();
        if(typeof loadPoolData === "function") loadPoolData();
    });
}

function buildDefaultOrari() {
    let obj = {};
    for(let i=1; i<=7; i++) obj[i] = { active: true, m_in: "10:00", m_out: "13:00", p_in: "14:00", p_out: "19:00" };
    return obj;
}

function savePoolEntry(date, entry, isFullUpdate = false) {
    if (!poolData) poolData = {};
    if (!poolData[date]) poolData[date] = [];
    if (!isFullUpdate && entry) poolData[date].push(entry);

    poolRef.child(date).set(poolData[date]).then(() => {
        if(typeof loadPoolData === "function") loadPoolData();
    }).catch(error => console.error("Errore salvataggio Cloud:", error));
}

function removePoolEntry(date, id) {
    if(poolData[date]) {
        poolData[date] = poolData[date].filter(x => x.id !== id);
        poolRef.child(date).set(poolData[date]);
    }
}

/* --- 2. Logic Manager --- */
function showBlueToast(msg) {
    const x = document.getElementById("toastBlue");
    const txt = document.getElementById("toastMsg");
    txt.innerText = msg;
    x.classList.add("show");
    setTimeout(() => x.classList.remove("show"), 3000);
}

function tToMin(timeStr) {
    if(!timeStr || typeof timeStr !== 'string') return 0;
    const [h, m] = timeStr.split(':').map(Number);
    return (h * 60) + m;
}

function mToT(m) { 
    return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; 
}

function changePoolDate(offset) {
    const p = document.getElementById("poolDate");
    const d = new Date(p.value); 
    d.setDate(d.getDate() + offset);
    p.value = d.toISOString().split('T')[0];
    loadPoolData();
}

function getDayOfWeek(dateString) {
    let d = new Date(dateString).getDay();
    return d === 0 ? 7 : d; 
}

function generateDynamicSlots(dateStr) {
    const dayIdx = getDayOfWeek(dateStr);
    const orariP = dbOrari.piscina[dayIdx];
    const orariS = dbOrari.spa[dayIdx];
    
    let slotsSet = new Set();
    
    const addSlots = (orari) => {
        if(!orari || !orari.active) return;
        if(orari.m_in && orari.m_out) {
            for(let i = tToMin(orari.m_in); i < tToMin(orari.m_out); i += 60) {
                slotsSet.add(mToT(Math.floor(i/60)*60)); 
            }
        }
        if(orari.p_in && orari.p_out) {
            for(let i = tToMin(orari.p_in); i < tToMin(orari.p_out); i += 60) {
                slotsSet.add(mToT(Math.floor(i/60)*60));
            }
        }
    };
    
    addSlots(orariP); addSlots(orariS);
    return Array.from(slotsSet).sort((a,b) => tToMin(a) - tToMin(b));
}

function loadPoolData() {
    const d = document.getElementById("poolDate").value;
    const list = Array.isArray(poolData[d]) ? poolData[d] : [];
    
    list.sort((a,b) => (a.ora || "").localeCompare(b.ora || ""));
    const grid = document.getElementById("poolGrid");
    grid.innerHTML = "";

    list.forEach(item => {
        const badgeClass = item.area === "SPA" ? "bg-spa" : (item.area === "Esterni" ? "bg-out" : "bg-pool");
        const checkClass = item.checked ? "checked" : "";
        const checkIcon = item.checked ? "check_circle" : "login";

        grid.innerHTML += `
            <div class="row">
                <div style="font-weight:bold">${item.ora}</div>
                <div><b>${item.cam}</b></div>
                <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.cog}</div>
                <div style="text-align:center">${item.pers}</div>
                <div><span class="badge ${badgeClass}">${item.area}</span></div>
                <div><button class="btn-check ${checkClass}" onclick="toggleCheckIn('${item.id}')"><i class="material-icons-round" style="font-size:12px">${checkIcon}</i></button></div>
                <div><button class="btn-icon" onclick="editEntry('${item.id}')"><i class="material-icons-round" style="color:var(--gold)">edit</i></button></div>
                <div><button class="btn-icon" onclick="deleteEntry('${item.id}')"><i class="material-icons-round" style="color:var(--red)">delete</i></button></div>
            </div>
        `;
    });

    const slotTable = document.getElementById("slotTable");
    slotTable.innerHTML = "";
    const dynamicSlots = generateDynamicSlots(d);

    if (dynamicSlots.length === 0) {
        slotTable.innerHTML = "<tr><td colspan='5' style='padding:20px; color:var(--red);'>Struttura Chiusa o Orari Non Impostati</td></tr>";
        return;
    }

    dynamicSlots.forEach(slot => {
        const slotStart = tToMin(slot);
        const slotEnd = slotStart + 60; 
        let pPisc = 0, pSpa = 0, pTot = 0, pCheck = 0;

        list.forEach(item => {
            const nPers = Number(item.pers); 
            if (isNaN(nPers) || nPers <= 0) return;
            const entryStart = tToMin(item.ora);
            const entryEnd = entryStart + 120; 
            const overlap = Math.max(entryStart, slotStart) < Math.min(entryEnd, slotEnd);

            if (overlap) {
                pTot += nPers;
                if (item.area === "SPA") pSpa += nPers;
                else if (item.area === "Piscina") pPisc += nPers;
                if (item.checked === true) pCheck += nPers;
            }
        });

        const bgRow = pTot > 0 ? "background:rgba(255,255,255,0.05)" : "";
        const wBold = pTot > 0 ? "font-weight:bold; color:var(--text-main)" : "opacity:0.5";
        const checkColor = pCheck > 0 ? "var(--green)" : "inherit";

        slotTable.innerHTML += `
            <tr style="${bgRow}; ${wBold}">
                <td>${slot}</td>
                <td>${pPisc > 0 ? pPisc : '-'}</td>
                <td>${pSpa > 0 ? pSpa : '-'}</td>
                <td style="font-size:13px">${pTot > 0 ? pTot : '-'}</td>
                <td style="color:${checkColor}">${pCheck > 0 ? pCheck : '-'}</td>
            </tr>
        `;
    });
}

// CRUD
function editEntry(id) {
    const d = document.getElementById("poolDate").value;
    const item = (poolData[d] || []).find(x => x.id === id);
    if(!item) return;

    document.getElementById("pId").value = item.id;
    document.getElementById("pOra").value = item.ora;
    document.getElementById("pCam").value = item.cam;
    document.getElementById("pCog").value = item.cog;
    document.getElementById("pPers").value = item.pers;
    document.getElementById("pArea").value = item.area;
    document.getElementById("pNote").value = item.note || "";

    const btn = document.getElementById("btnSave");
    btn.innerHTML = "<i class='material-icons-round'>update</i> AGGIORNA INGRESSO";
    btn.classList.add("editing");
    document.getElementById("formTitle").innerHTML = "<i class='material-icons-round' style='color:var(--gold)'>edit</i> MODIFICA IN CORSO";
    document.getElementById("btnCancel").style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
    document.getElementById("pId").value = ""; document.getElementById("pCam").value = "";
    document.getElementById("pCog").value = ""; document.getElementById("pNote").value = "";
    document.getElementById("pPers").value = "2";
    document.getElementById("pOra").value = new Date().toTimeString().split(' ')[0].substring(0,5);

    const btn = document.getElementById("btnSave");
    btn.innerHTML = "<i class='material-icons-round'>save</i> SALVA INGRESSO";
    btn.classList.remove("editing");
    document.getElementById("formTitle").innerHTML = "<i class='material-icons-round'>add_circle</i> NUOVO INGRESSO (2H)";
    document.getElementById("btnCancel").style.display = "none";
}

function addEntry() {
    const d = document.getElementById("poolDate").value;
    const id = document.getElementById("pId").value;
    const ora = document.getElementById("pOra").value;
    
    if(!ora) return showBlueToast("Errore: Orario mancante"); 
    if(!document.getElementById("pCam").value) return showBlueToast("Errore: Camera mancante"); 

    if (!poolData[d]) poolData[d] = [];
    let isChecked = false;
    if(id) { const existing = poolData[d].find(x => x.id === id); if(existing) isChecked = existing.checked; }

    const entry = {
        id: id ? id : "P" + Date.now(), ora: ora,
        cam: document.getElementById("pCam").value, cog: document.getElementById("pCog").value,
        pers: parseInt(document.getElementById("pPers").value) || 0,
        area: document.getElementById("pArea").value, note: document.getElementById("pNote").value,
        checked: isChecked
    };

    if(id) {
        poolData[d] = poolData[d].filter(x => x.id !== id);
        poolData[d].push(entry);
        savePoolEntry(d, null, true); showBlueToast("Appuntamento Modificato");
    } else {
        savePoolEntry(d, entry, false); showBlueToast("Nuovo Inserimento Creato");
    }
    resetForm();
}

function toggleCheckIn(id) {
    const d = document.getElementById("poolDate").value;
    if(!poolData[d]) return;
    const item = poolData[d].find(x => x.id === id);
    if(item) { item.checked = !item.checked; savePoolEntry(d, null, true); }
}

function deleteEntry(id) { 
    if(!confirm("Eliminare definitivamente questo ingresso?")) return;
    removePoolEntry(document.getElementById("poolDate").value, id); 
    if(document.getElementById("pId").value === id) resetForm();
    showBlueToast("Appuntamento Eliminato");
}

function searchRoom() {
    const cam = document.getElementById("searchCam").value;
    if(!cam) return showBlueToast("Inserisci Camera"); 
    const list = poolData[document.getElementById("poolDate").value] || [];
    const found = list.filter(x => x.cam == cam);
    
    const mBtns = document.getElementById("modalBtns");
    mBtns.innerHTML = ""; 

    if(found.length > 0) {
        document.getElementById("modalTitle").innerText = `Camera ${cam} TROVATA`;
        document.getElementById("modalMsg").innerText = `Ci sono ${found.length} prenotazioni.`;
        
        found.forEach(item => {
            const status = item.checked ? "GIA' DENTRO" : "FAI CHECK-IN";
            const color = item.checked ? "var(--bg-panel)" : "var(--green)";
            const border = item.checked ? "1px solid var(--line)" : "none";
            mBtns.innerHTML += `
                <div style="border:1px solid var(--line); padding:12px; border-radius:12px; margin-bottom:8px; background:var(--bg-body); text-align:left">
                    <div style="font-size:12px; font-weight:bold; color:var(--text-main);">${item.ora} - ${item.area} (${item.pers} pax)</div>
                    <button class="modal-btn" style="background:${color}; border:${border}; color:white; margin-top:8px; padding:10px" 
                            onclick="forceCheckIn('${item.id}')">${status}</button>
                </div>
            `;
        });
        mBtns.innerHTML += `<button class="modal-btn" style="background:var(--gold); color:#0f172a; margin-top:10px" onclick="prefillNew('${cam}')">AGGIUNGI NUOVO ORARIO</button>`;
    } else {
        document.getElementById("modalTitle").innerText = `Camera ${cam}`;
        document.getElementById("modalMsg").innerText = "Nessun accesso registrato oggi.";
        mBtns.innerHTML = `<button class="modal-btn" style="background:var(--accent); color:#0f172a" onclick="prefillNew('${cam}')">CREA INGRESSO</button>`;
    }
    document.getElementById("actionModal").style.display = "flex";
}

function forceCheckIn(id) { toggleCheckIn(id); closeModal(); showBlueToast("Check-in Effettuato"); }
function prefillNew(cam) { resetForm(); document.getElementById("pCam").value = cam; document.getElementById("pCam").focus(); closeModal(); }
function closeModal() { document.getElementById("actionModal").style.display = "none"; }

/* --- 3. Backup Manager --- */
function exportSimpleExcel() {
    const d = document.getElementById("poolDate").value;
    const list = poolData[d] || [];
    if(list.length === 0) return alert("Nessun dato da esportare per oggi.");

    let csv = "N. CAMERA;NOME E COGNOME;PAX;TIPOLOGIA DI ACCESSO\n";
    list.forEach(row => {
        const cam = (row.cam || "").toString().replace(/;/g, "");
        const cog = (row.cog || "").toString().replace(/;/g, " ");
        const pax = (row.pers || "1").toString().replace(/;/g, "");
        const area = (row.area || "").toString().replace(/;/g, "");
        csv += `${cam};${cog};${pax};${area}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `Lista_Accessi_${d}.csv`;
    a.click();
}

/* --- 4. Inizializzazione --- */
document.addEventListener('DOMContentLoaded', () => {
    if(localStorage.getItem('tw_theme') === 'light') document.documentElement.classList.add('light-theme');
    
    document.getElementById("poolDate").valueAsDate = new Date();
    document.getElementById("poolDate").onchange = loadPoolData;
    document.getElementById("pOra").value = new Date().toTimeString().split(' ')[0].substring(0,5);
    
    initDB();

    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") { closeModal(); resetForm(); }
    });
});
</script>
