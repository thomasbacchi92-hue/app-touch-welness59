<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trattamenti Master - TOUCH WELNESS</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  :root { --bg-body: #0f172a; --bg-panel: #1e293b; --border-line: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --gold: #fbbf24; --green: #10b981; --red: #ef4444; }
  :root.light-theme { --bg-body: #f8fafc; --bg-panel: #ffffff; --border-line: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; }
  body { font-family: -apple-system, sans-serif; background: var(--bg-body); margin: 0; color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  * { box-sizing: border-box; }
  .navbar { background: var(--bg-panel); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; flex-shrink: 0; }
  .navbar h1 { margin: 0; font-size: 18px; color: var(--accent); display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px;}
  .btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.2s; font-size: 13px; }
  .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
  .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-line); }
  .btn-gold { background: var(--gold); color: #0f172a; }
  .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; }
  .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--bg-panel); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border-line); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
  .data-table th { color: var(--text-muted); padding: 12px; border-bottom: 2px solid var(--border-line); font-size: 11px; text-transform: uppercase; background: var(--bg-body); position: sticky; top:0; z-index:2;}
  .data-table td { padding: 12px; border-bottom: 1px solid var(--border-line); color: var(--text-main); }
  .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-muted); transition: 0.2s; padding:5px;}
  .btn-icon:hover { color: var(--red); transform: scale(1.1); }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 15px;}
  .modal-box { background: var(--bg-panel); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid var(--border-line); }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
  .form-input { width: 100%; padding: 12px; border: 1px solid var(--border-line); border-radius: 8px; font-size: 14px; background: var(--bg-body); color: var(--text-main); outline: none; transition: 0.2s; }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
  #toastBlue { visibility: hidden; min-width: 250px; background: var(--green); color: white; text-align: center; border-radius: 8px; padding: 16px; position: fixed; right: 30px; bottom: 30px; z-index: 9999; font-size: 14px; font-weight: bold; opacity: 0; transition: 0.5s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
  #toastBlue.show { visibility: visible; opacity: 1; bottom: 40px; }
</style>
<script>if(localStorage.getItem('tw_admin_theme') === 'light') document.documentElement.classList.add('light-theme');</script>
</head>
<body>

<div id="toastBlue">Notifica</div>

<div class="navbar">
    <h1><i class="material-icons-round">spa</i> Archivio Trattamenti Master</h1>
    <button class="btn-action btn-outline" onclick="if(window.parent && window.parent.app && typeof window.parent.app.switchView === 'function') { window.parent.app.switchView('stats'); } else { window.history.back(); }">
        <i class="material-icons-round">arrow_back</i> TORNA ALLA DASHBOARD
    </button>
</div>

<div class="main-content">
    <div class="container">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                <h2 style="margin:0; font-size:18px; color:var(--gold);">Tecniche e Prezzi Base</h2>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn-action btn-gold" onclick="treatApp.importDefaultList()">
                        <i class="material-icons-round">flash_on</i> IMPORTA LISTINO COMPLETO
                    </button>
                    <button class="btn-action" onclick="document.getElementById('newGlobalTreatmentModal').style.display='flex'">
                        <i class="material-icons-round">add</i> NUOVA TECNICA SINGOLA
                    </button>
                </div>
            </div>
            
            <div style="overflow-x:auto; border:1px solid var(--border-line); border-radius:12px;">
                <table class="data-table">
                    <thead><tr><th>Nome Tecnica</th><th>Durata</th><th>Prezzo Base</th><th style="text-align:right">Azione</th></tr></thead>
                    <tbody id="globalTreatmentsTable">
                        <tr><td colspan='4' style='text-align:center; padding:20px; color:var(--text-muted)'>Caricamento...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="newGlobalTreatmentModal" class="modal-overlay" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
        <h3 style="margin-top:0; color:var(--text-main); border-bottom:1px solid var(--border-line); padding-bottom:10px;">Nuova Tecnica (Globale)</h3>
        <div class="form-group"><label>Nome Tecnica</label><input type="text" id="gtName" class="form-input" placeholder="Es. Massaggio Svedese"></div>
        <div class="form-group"><label>Durata (Minuti)</label><input type="number" id="gtTime" class="form-input" placeholder="Es. 50"></div>
        <div class="form-group"><label>Prezzo Consigliato (€)</label><input type="number" id="gtCost" class="form-input" step="0.01" placeholder="Es. 80.00"></div>
        <div style="display:flex; gap:10px; margin-top:20px">
            <button class="btn-action btn-outline" style="width:100%" onclick="document.getElementById('newGlobalTreatmentModal').style.display='none'">ANNULLA</button>
            <button class="btn-action" style="width:100%; background:var(--green); color:white;" onclick="treatApp.saveGlobalTreatment()">SALVA</button>
        </div>
    </div>
</div>

<script>
    const fbConfig = { apiKey: "AIzaSyCrDuK7SWHdbzrJR-pNpxmRwGnZgV2Dd2Y", authDomain: "touch-welness-massage.firebaseapp.com", databaseURL: "https://touch-welness-massage-default-rtdb.europe-west1.firebasedatabase.app", projectId: "touch-welness-massage", storageBucket: "touch-welness-massage.firebasestorage.app" };
    if (!firebase.apps.length) firebase.initializeApp(fbConfig);

    window.treatApp = {
        db: firebase.database().ref('MASTER_ADMIN_DB'),
        
        init: function() {
            this.db.child('global_treatments').on('value', snap => {
                const treats = snap.val() || {};
                const tbody = document.getElementById('globalTreatmentsTable');
                tbody.innerHTML = "";
                if(Object.keys(treats).length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding:20px; color:var(--text-muted)'>Nessuna tecnica. Clicca su IMPORTA LISTINO COMPLETO.</td></tr>";
                    return;
                }
                Object.entries(treats).forEach(([k, t]) => {
                    tbody.innerHTML += `<tr>
                        <td><b style="color:var(--text-main)">${t.nome}</b></td>
                        <td>${t.durata} min</td>
                        <td><b style="color:var(--gold)">${parseFloat(t.prezzo).toFixed(2)} €</b></td>
                        <td style="text-align:right"><button class="btn-icon" onclick="treatApp.deleteGlobalTreatment('${k}')"><i class="material-icons-round">delete</i></button></td>
                    </tr>`;
                });
            });
        },
        
        showToast: function(m) { const t=document.getElementById("toastBlue"); t.innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); },
        
        saveGlobalTreatment: function() {
            const n = document.getElementById('gtName').value;
            const d = parseInt(document.getElementById('gtTime').value);
            const c = parseFloat(document.getElementById('gtCost').value);
            if(!n || isNaN(d) || isNaN(c)) return this.showToast("Compila tutti i campi correttamente");
            
            this.db.child('global_treatments').push({ nome: n, durata: d, prezzo: c }).then(() => {
                this.showToast("Tecnica Aggiunta all'Archivio Master");
                document.getElementById('newGlobalTreatmentModal').style.display = 'none';
                document.getElementById('gtName').value = ""; document.getElementById('gtTime').value = ""; document.getElementById('gtCost').value = "";
            });
        },
        
        deleteGlobalTreatment: function(id) {
            if(confirm("Eliminare definitivamente questa tecnica dall'archivio master? Le SPA che l'hanno già importata non la perderanno.")) {
                this.db.child('global_treatments').child(id).remove().then(()=> this.showToast("Tecnica eliminata dal Master"));
            }
        },

        // FUNZIONE MAGICA PER IMPORTARE IL TUO LISTINO CON UN CLICK
        importDefaultList: function() {
            if(!confirm("Vuoi importare il tuo listino massaggi predefinito? Verranno inserite 21 tecniche.")) return;
            
            const listino = [
                { nome: "Massaggio relax svedese (30 min)", prezzo: 60, durata: 30 },
                { nome: "Massaggio relax svedese (50 min)", prezzo: 80, durata: 50 },
                { nome: "Massaggio relax svedese (70 min)", prezzo: 100, durata: 70 },
                { nome: "Massaggio decontratturante (30 min)", prezzo: 60, durata: 30 },
                { nome: "Massaggio decontratturante (50 min)", prezzo: 80, durata: 50 },
                { nome: "Massaggio sportivo", prezzo: 80, durata: 50 },
                { nome: "Linfodrenaggio Vodder", prezzo: 80, durata: 50 },
                { nome: "Massaggio svedese di coppia", prezzo: 140, durata: 50 },
                { nome: "Massaggio anticellulite", prezzo: 80, durata: 50 },
                { nome: "Massaggio del risveglio", prezzo: 50, durata: 30 },
                { nome: "Massaggio ayurvedico", prezzo: 90, durata: 50 },
                { nome: "Massaggio viso argan", prezzo: 50, durata: 30 },
                { nome: "Hawayano Lomi Lomi", prezzo: 90, durata: 50 },
                { nome: "Massaggio Californiano", prezzo: 90, durata: 50 },
                { nome: "Riflessologia Plantare", prezzo: 50, durata: 30 },
                { nome: "Rituale Viso Kobido", prezzo: 100, durata: 60 },
                { nome: "Rituale Hot Stone", prezzo: 90, durata: 60 },
                { nome: "Rituale Maori", prezzo: 100, durata: 60 },
                { nome: "Rituale Maori (Long)", prezzo: 120, durata: 80 },
                { nome: "Antico termale romano", prezzo: 130, durata: 80 },
                { nome: "Thai Oil Massage", prezzo: 80, durata: 50 }
            ];

            listino.forEach((t, i) => {
                setTimeout(() => {
                    this.db.child('global_treatments').push(t);
                }, i * 50); // Leggero ritardo per scriverli in ordine corretto nel DB
            });
            
            setTimeout(() => {
                this.showToast("Listino importato con successo!");
            }, listino.length * 50 + 500);
        }
    };
    
    window.onload = () => window.treatApp.init();
</script>
</body>
</html>
