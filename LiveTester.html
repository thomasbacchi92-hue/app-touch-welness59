<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER LIVE TESTER PRO - TOUCH WELNESS</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
    :root { 
        --primary: #0f172a; --accent: #38bdf8; --gold: #fbbf24; --bg: #0f172a; 
        --panel: #1e293b; --text: #f8fafc; --muted: #94a3b8; --red: #ef4444; --green: #10b981;
    }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; font-size: 14px; }
    .container { max-width: 900px; margin: 0 auto; background: var(--panel); border-radius: 15px; border: 2px solid var(--accent); overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    
    .header { background: var(--accent); color: var(--primary); padding: 20px; text-align: center; }
    .header h1 { margin: 0; font-size: 22px; font-weight: 900; text-transform: uppercase; }
    
    .grid-config { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 25px; border-bottom: 1px solid #334155; }
    .config-box { display: flex; flex-direction: column; gap: 10px; }
    .config-box label { font-weight: bold; color: var(--gold); font-size: 12px; text-transform: uppercase; }
    
    input, select { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; outline: none; }
    input:focus { border-color: var(--accent); }
    
    .range-group { display: flex; gap: 10px; align-items: center; }
    .range-group input { flex: 1; }

    .btn-container { padding: 20px; display: flex; gap: 15px; background: rgba(0,0,0,0.2); }
    .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
    .btn-inject { background: var(--green); color: var(--primary); }
    .btn-inject:hover { background: #059669; transform: translateY(-2px); }
    .btn-clear { background: var(--red); color: white; }
    .btn-clear:hover { background: #dc2626; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #logArea { height: 250px; background: #000; color: #00ff00; font-family: 'Courier New', monospace; padding: 15px; overflow-y: auto; font-size: 12px; border-top: 2px solid #334155; }
    .log-entry { margin-bottom: 4px; border-bottom: 1px solid #111; padding-bottom: 2px; }
    .log-success { color: #38bdf8; }
    .log-warn { color: #fbbf24; }
    .log-error { color: #ef4444; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚀 Calibrazione Stress Test & Demo</h1>
    </div>

    <div class="grid-config">
        <div class="config-box">
            <label>Numero Strutture da generare</label>
            <input type="number" id="numStructures" value="3" min="1">
            
            <label>Giorni di simulazione (Retroattivi)</label>
            <input type="number" id="numDays" value="7" min="1">
        </div>

        <div class="config-box">
            <label>Operatori per struttura (Min - Max)</label>
            <div class="range-group">
                <input type="number" id="minOps" value="2">
                <span>a</span>
                <input type="number" id="maxOps" value="5">
            </div>
            
            <label>Fatturato (Prezzo medio Servizio €)</label>
            <input type="number" id="avgPrice" value="65">
        </div>

        <div class="config-box">
            <label>Appuntamenti giornalieri (Min - Max)</label>
            <div class="range-group">
                <input type="number" id="minApp" value="5">
                <span>a</span>
                <input type="number" id="maxApp" value="20">
            </div>
            <p style="font-size:10px; color:var(--muted); margin:0">Genera variabilità casuale tra i giorni.</p>
        </div>

        <div class="config-box">
            <label>Flusso Reception (Ticket/Richieste)</label>
            <select id="receptionFlow">
                <option value="0">Nessuna Richiesta (Solo Agenda Diretta)</option>
                <option value="0.2">Basso (20% delle attività sono richieste)</option>
                <option value="0.5" selected>Medio (50% delle attività sono richieste)</option>
                <option value="0.8">Alto (80% delle attività sono richieste)</option>
            </select>
            
            <label>Percentuale Pagati/Eseguiti</label>
            <input type="range" id="completionRate" min="0" max="100" value="85">
            <div style="display:flex; justify-content:space-between; font-size:10px">
                <span>0% (Solo bozze)</span>
                <span id="rateVal">85%</span>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn btn-clear" onclick="clearTestData()" id="btnClear">Pulisci Dati Test</button>
        <button class="btn btn-inject" onclick="startInjection()" id="btnInject">Avvia Iniezione Calibrata</button>
    </div>

    <div id="logArea">
        <div class="log-entry">Pronto per il test. Tutti i dati generati avranno prefisso "TEST_".</div>
    </div>
</div>

<script>
    const fbConfig = {
        apiKey: "AIzaSyCrDuK7SWHdbzrJR-pNpxmRwGnZgV2Dd2Y",
        authDomain: "touch-welness-massage.firebaseapp.com",
        databaseURL: "https://touch-welness-massage-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "touch-welness-massage",
        storageBucket: "touch-welness-massage.firebasestorage.app"
    };

    if (!firebase.apps.length) firebase.initializeApp(fbConfig);
    const dbRef = firebase.database().ref('MASTER_ADMIN_DB');

    document.getElementById('completionRate').oninput = function() {
        document.getElementById('rateVal').innerText = this.value + "%";
    };

    function addLog(msg, type = "") {
        const logArea = document.getElementById('logArea');
        const entry = document.createElement('div');
        entry.className = 'log-entry ' + (type ? 'log-' + type : '');
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
    }

    const cognomi = ["Rossi", "Bianchi", "Verdi", "Rizzo", "Ferrari", "Esposito", "Gallo", "Fontana", "Conti", "Moretti"];
    const nomiServizi = ["Massaggio Relax", "Trattamento Viso", "Percorso SPA", "Massaggio Decontratturante", "Scrub Corpo", "Manicure Pro", "Rituale Pietre Calde"];
    const cabine = [1, 2, 3, 4, 5];
    const orari = ["10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];

    async function startInjection() {
        const btn = document.getElementById('btnInject');
        btn.disabled = true;
        
        const params = {
            numS: parseInt(document.getElementById('numStructures').value),
            numD: parseInt(document.getElementById('numDays').value),
            minOps: parseInt(document.getElementById('minOps').value),
            maxOps: parseInt(document.getElementById('maxOps').value),
            avgPrice: parseFloat(document.getElementById('avgPrice').value),
            minApp: parseInt(document.getElementById('minApp').value),
            maxApp: parseInt(document.getElementById('maxApp').value),
            recRate: parseFloat(document.getElementById('receptionFlow').value),
            compRate: parseInt(document.getElementById('completionRate').value) / 100
        };

        addLog(`Inizio iniezione per ${params.numS} strutture...`, "success");

        try {
            for (let s = 0; s < params.numS; s++) {
                const sid = "TEST_SID_" + Math.random().toString(36).substr(2, 9).toUpperCase();
                addLog(`Creazione Struttura: ${sid}`);

                // 1. Dati Anagrafici Struttura
                await dbRef.child('structures').child(sid).set({
                    name: "Wellness Center " + (s + 1),
                    license: "Premium",
                    status: "active",
                    created: new Date().toISOString()
                });

                // 2. Staff
                const staffCount = Math.floor(Math.random() * (params.maxOps - params.minOps + 1)) + params.minOps;
                const staffList = [];
                for(let i=0; i<staffCount; i++) {
                    staffList.push({
                        name: "Operatore " + (i+1),
                        nick: "OP_" + (i+1) + "_" + s,
                        color: "#" + Math.floor(Math.random()*16777215).toString(16),
                        active: true
                    });
                }
                await dbRef.child('structures_data').child(sid).child('staff').set(staffList);

                // 3. Servizi
                const servizi = nomiServizi.map((n, idx) => ({
                    id: "serv_" + idx,
                    nome: n,
                    prezzo: (params.avgPrice + (Math.random() * 20 - 10)).toFixed(2),
                    durata: 30 + (Math.floor(Math.random() * 3) * 30),
                    cat: idx % 2 === 0 ? "Massaggi" : "Estetica"
                }));
                await dbRef.child('structures_data').child(sid).child('servizi').set(servizi);

                // 4. Appuntamenti e Richieste per ogni giorno
                const today = new Date();
                for (let d = 0; d < params.numD; d++) {
                    const simDate = new Date();
                    simDate.setDate(today.getDate() - d);
                    const dateKey = simDate.toISOString().split('T')[0];

                    const dailyAppCount = Math.floor(Math.random() * (params.maxApp - params.minApp + 1)) + params.minApp;
                    const dayApps = [];
                    const dayReqs = [];

                    for (let a = 0; a < dailyAppCount; a++) {
                        const isFromReception = Math.random() < params.recRate;
                        const op = staffList[Math.floor(Math.random() * staffList.length)];
                        const serv = servizi[Math.floor(Math.random() * servizi.length)];
                        const isDone = Math.random() < params.compRate;

                        const appObj = {
                            id: "TEST_APP_" + Math.random().toString(36).substr(2, 5),
                            cam: Math.floor(Math.random() * 500) + 100,
                            cog: cognomi[Math.floor(Math.random() * cognomi.length)],
                            serv: serv.nome,
                            price: serv.prezzo,
                            op: op.name,
                            ora: orari[Math.floor(Math.random() * orari.length)],
                            cabina: cabine[Math.floor(Math.random() * cabine.length)],
                            eseguito: isDone,
                            pagato: isDone && Math.random() > 0.1,
                            timestamp: Date.now()
                        };

                        dayApps.push(appObj);

                        if (isFromReception) {
                            dayReqs.push({
                                ...appObj,
                                id: "TEST_REQ_" + Math.random().toString(36).substr(2, 5),
                                status: isDone ? 'accepted' : 'pending',
                                dur: serv.durata
                            });
                        }
                    }

                    await dbRef.child('structures_data').child(sid).child('app').child(dateKey).set(dayApps);
                    if(dayReqs.length > 0) {
                        await dbRef.child('structures_data').child(sid).child('requests').child(dateKey).set(dayReqs);
                    }
                }
                addLog(`Dati iniettati per ${sid} (${params.numD} giorni)`, "success");
            }
            addLog("🎉 TEST COMPLETATO CON SUCCESSO!", "success");
        } catch (err) {
            addLog("ERRORE: " + err.message, "error");
        } finally {
            btn.disabled = false;
        }
    }

    async function clearTestData() {
        if(!confirm("Vuoi davvero cancellare TUTTI i dati che iniziano con TEST_?")) return;
        
        const btn = document.getElementById('btnClear');
        btn.disabled = true;
        addLog("Inizio pulizia totale...", "warn");

        try {
            const snap = await dbRef.once('value');
            const data = snap.val();
            const updates = {};

            const checkAndDelete = (node, path) => {
                if(!node) return;
                Object.keys(node).forEach(key => {
                    if(key.startsWith('TEST_')) {
                        updates[`${path}/${key}`] = null;
                    }
                });
            };

            checkAndDelete(data.structures, 'structures');
            checkAndDelete(data.users, 'users');
            checkAndDelete(data.structures_data, 'structures_data');

            await dbRef.update(updates);
            addLog("Database pulito!", "success");
        } catch (e) {
            addLog("Errore pulizia: " + e.message, "error");
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
